<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Náutica AR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
    #camara { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
    #info { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 20px; z-index: 2; font-size: 12px; text-align: center; white-space: nowrap; }
    #brujula { position: fixed; top: 20px; right: 15px; background: rgba(0,0,80,0.8); padding: 8px 14px; border-radius: 20px; z-index: 2; font-size: 15px; border: 1px solid #4af; }
    #disclaimer { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(180,0,0,0.8); padding: 6px 14px; border-radius: 10px; z-index: 2; font-size: 10px; text-align: center; max-width: 90%; }
    #creditos { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.5); padding: 3px 10px; border-radius: 10px; z-index: 2; font-size: 9px; color: #aaa; }

    /* Botón destino */
    #btnDestino { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,80,180,0.9); padding: 12px 30px; border-radius: 25px; z-index: 2; font-size: 15px; border: 1px solid #4af; cursor: pointer; }

    /* Panel de lista */
    #panelLista { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(0,10,30,0.97); z-index: 10; border-radius: 20px 20px 0 0; padding: 16px; }
    #panelLista h3 { text-align: center; margin-bottom: 12px; color: #4af; }
    .item-punto { padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.1); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .item-punto:active { background: rgba(0,100,255,0.3); }
    .item-nombre { font-size: 15px; }
    .item-dist { font-size: 12px; color: #adf; }
    #btnCerrar { display: block; margin: 16px auto 0; background: rgba(180,0,0,0.7); padding: 10px 30px; border-radius: 20px; border: none; color: #fff; font-size: 14px; cursor: pointer; }

    /* Flecha direccional */
    #flecha { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 5; text-align: center; }
    #flecha-icono { font-size: 80px; line-height: 1; }
    #flecha-info { background: rgba(0,0,0,0.7); padding: 6px 14px; border-radius: 12px; font-size: 13px; margin-top: 8px; }

    /* Marcador AR */
    .marcador { position: fixed; z-index: 3; text-align: center; transform: translateX(-50%); pointer-events: none; }
    .marcador-punto { width: 16px; height: 16px; border-radius: 50%; margin: 0 auto 4px; border: 2px solid white; }
    .marcador-label { background: rgba(0,0,0,0.8); padding: 4px 10px; border-radius: 8px; font-size: 13px; white-space: nowrap; border: 1px solid rgba(255,255,255,0.4); }
    .marcador-dist { font-size: 11px; color: #adf; margin-top: 3px; }
  </style>
</head>
<body>
  <video id="camara" autoplay playsinline></video>
  <div id="info">GPS: esperando señal...</div>
  <div id="brujula">⊕ ---°</div>
  <div id="creditos">Datos: © OpenSeaMap contributors</div>
  <div id="disclaimer">AVISO: Solo ayuda visual. No sustituye instrumentos náuticos certificados.</div>
  <button id="btnDestino" onclick="abrirLista()">🧭 Seleccionar Destino</button>

  <!-- Lista de puntos -->
  <div id="panelLista">
    <h3>Selecciona un destino</h3>
    <div id="listaPuntos"></div>
    <button id="btnCerrar" onclick="cerrarLista()">✕ Cerrar</button>
  </div>

  <!-- Flecha direccional -->
  <div id="flecha">
    <div id="flecha-icono">➡️</div>
    <div id="flecha-info">---</div>
  </div>

  <script>
    // ── FILTRO DE KALMAN ───────────────────────────────────────
    class KalmanBrujula {
      constructor() { this.Q=0.001; this.R=0.1; this.P=1; this.x=null; this.K=0; }
      filtrar(m) {
        if (this.x === null) { this.x = m; return this.x; }
        let diff = m - this.x;
        if (diff > 180) diff -= 360;
        if (diff < -180) diff += 360;
        const ma = this.x + diff;
        this.P += this.Q;
        this.K = this.P / (this.P + this.R);
        this.x += this.K * (ma - this.x);
        this.P = (1 - this.K) * this.P;
        this.x = (360 - this.x + 360) % 360;
        return this.x;
      }
    }

    // ── PUNTOS NÁUTICOS ────────────────────────────────────────
    const PUNTOS = [
      { nombre: "Pta. Torrecilla",     lat: 18.4281, lon: -69.8767, color: "#ffdd00", tipo: "⚓" },
      { nombre: "Pta. Palenque",       lat: 18.2050, lon: -70.1450, color: "#ff6600", tipo: "⚓" },
      { nombre: "Puerto Sto. Domingo", lat: 18.4720, lon: -69.9020, color: "#00aaff", tipo: "🚢" },
      { nombre: "Puerto Plata",        lat: 19.7808, lon: -70.6871, color: "#00ff99", tipo: "⚓" },
    ];

    const kalman = new KalmanBrujula();
    let miLat = null, miLon = null;
    let rumboFiltrado = 0;
    let usandoAbsolute = false;
    let destinoActivo = null;
    const FOV_H = 90;

    // ── CÁMARA ─────────────────────────────────────────────────
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
      .then(stream => { document.getElementById('camara').srcObject = stream; })
      .catch(() => { document.getElementById('info').textContent = 'Error: cámara no disponible'; });

    // ── GPS ────────────────────────────────────────────────────
    navigator.geolocation.watchPosition(pos => {
      miLat = pos.coords.latitude;
      miLon = pos.coords.longitude;
      document.getElementById('info').textContent = `GPS: ${miLat.toFixed(4)}, ${miLon.toFixed(4)}`;
      actualizarVista();
    }, () => {
      document.getElementById('info').textContent = 'GPS: sin señal';
    }, { enableHighAccuracy: true });

    // ── BRÚJULA ────────────────────────────────────────────────
    window.addEventListener('deviceorientationabsolute', e => {
      if (e.alpha !== null) { usandoAbsolute = true; procesarRumbo(e.alpha); }
    });
    window.addEventListener('deviceorientation', e => {
      if (usandoAbsolute) return;
      if (e.webkitCompassHeading !== undefined) procesarRumbo(e.webkitCompassHeading);
      else if (e.absolute && e.alpha !== null) procesarRumbo(e.alpha);
    });

    function procesarRumbo(m) {
      rumboFiltrado = kalman.filtrar(m);
      document.getElementById('brujula').textContent = `⊕ ${Math.round(rumboFiltrado)}°`;
      actualizarVista();
    }

    // ── CÁLCULOS ───────────────────────────────────────────────
    function calcularRumbo(lat1, lon1, lat2, lon2) {
      const r = d => d * Math.PI / 180;
      const dLon = r(lon2 - lon1);
      const y = Math.sin(dLon) * Math.cos(r(lat2));
      const x = Math.cos(r(lat1)) * Math.sin(r(lat2)) - Math.sin(r(lat1)) * Math.cos(r(lat2)) * Math.cos(dLon);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    function calcularDistancia(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // ── LISTA ──────────────────────────────────────────────────
    function abrirLista() {
      const lista = document.getElementById('listaPuntos');
      lista.innerHTML = '';
      PUNTOS.forEach((p, i) => {
        const dist = miLat ? calcularDistancia(miLat, miLon, p.lat, p.lon) : 0;
        const div = document.createElement('div');
        div.className = 'item-punto';
        div.innerHTML = `
          <span class="item-nombre">${p.tipo} ${p.nombre}</span>
          <span class="item-dist">${miLat ? dist.toFixed(1)+' km' : '---'}</span>
        `;
        div.onclick = () => seleccionarDestino(i);
        lista.appendChild(div);
      });
      document.getElementById('panelLista').style.display = 'block';
    }

    function cerrarLista() {
      document.getElementById('panelLista').style.display = 'none';
    }

    function seleccionarDestino(i) {
      destinoActivo = i;
      cerrarLista();
      document.getElementById('flecha').style.display = 'block';
      actualizarVista();
    }

    // ── VISTA AR + FLECHA ──────────────────────────────────────
    function actualizarVista() {
      if (miLat === null) return;
      const W = window.innerWidth, H = window.innerHeight;

      // Limpiar marcadores
      document.querySelectorAll('.marcador').forEach(m => m.remove());

      // Si hay destino activo
      if (destinoActivo !== null) {
        const p = PUNTOS[destinoActivo];
        const rumboPunto = calcularRumbo(miLat, miLon, p.lat, p.lon);
        const dist = calcularDistancia(miLat, miLon, p.lat, p.lon);
        let diff = rumboPunto - rumboFiltrado;
        if (diff > 180) diff -= 360;
        if (diff < -180) diff += 360;

        const distStr = dist < 1 ? (dist*1000).toFixed(0)+'m' : dist.toFixed(1)+'km';

        if (Math.abs(diff) < FOV_H / 2) {
          // Está en el campo visual — mostrar marcador AR
          document.getElementById('flecha').style.display = 'none';
          const x = W / 2 + (diff / (FOV_H / 2)) * (W / 2);
          const div = document.createElement('div');
          div.className = 'marcador';
          div.style.left = x + 'px';
          div.style.top = (H / 2 - 60) + 'px';
          div.innerHTML = `
            <div class="marcador-punto" style="background:${p.color}"></div>
            <div class="marcador-label">${p.tipo} ${p.nombre}</div>
            <div class="marcador-dist">${distStr}</div>
          `;
          document.body.appendChild(div);
        } else {
          // Fuera del campo visual — mostrar flecha
          document.getElementById('flecha').style.display = 'block';
          const icono = diff < 0 ? '⬅️' : '➡️';
          const gradosDiff = Math.abs(Math.round(diff));
          document.getElementById('flecha-icono').textContent = icono;
          document.getElementById('flecha-info').textContent =
            `${p.tipo} ${p.nombre} · ${distStr} · Gira ${gradosDiff}°`;
        }
      }
    }
  </script>
</body>
</html>
