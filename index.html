<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Náutica AR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
    #camara { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
    #info { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 20px; z-index: 2; font-size: 13px; text-align: center; white-space: nowrap; }
    #brujula { position: fixed; top: 20px; right: 20px; background: rgba(0,0,80,0.7); padding: 10px 16px; border-radius: 20px; z-index: 2; font-size: 16px; border: 1px solid #4af; }
    #disclaimer { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(180,0,0,0.8); padding: 8px 16px; border-radius: 10px; z-index: 2; font-size: 11px; text-align: center; max-width: 90%; }
    #creditos { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.5); padding: 4px 12px; border-radius: 10px; z-index: 2; font-size: 10px; color: #aaa; }
    .marcador { position: fixed; z-index: 3; text-align: center; transform: translateX(-50%); pointer-events: none; transition: left 0.4s ease, top 0.4s ease; }
    .marcador-punto { width: 12px; height: 12px; border-radius: 50%; margin: 0 auto 4px; border: 2px solid white; }
    .marcador-label { background: rgba(0,0,0,0.75); padding: 3px 8px; border-radius: 8px; font-size: 12px; white-space: nowrap; border: 1px solid rgba(255,255,255,0.3); }
    .marcador-dist { font-size: 10px; color: #adf; margin-top: 2px; }
  </style>
</head>
<body>
  <video id="camara" autoplay playsinline></video>
  <div id="info">GPS: esperando señal...</div>
  <div id="brujula">⊕ ---°</div>
  <div id="creditos">Datos: © OpenSeaMap contributors</div>
  <div id="disclaimer">AVISO: Solo ayuda visual. No sustituye instrumentos náuticos certificados.</div>

  <script>
    // ── FILTRO DE KALMAN PARA BRÚJULA ──────────────────────────
    class KalmanBrujula {
      constructor() {
        this.Q = 0.001;  // ruido del proceso (menor = más confianza en modelo)
        this.R = 0.1;    // ruido de medición (mayor = más filtrado)
        this.P = 1;      // estimación inicial de error
        this.x = null;   // estado actual (rumbo filtrado)
        this.K = 0;      // ganancia de Kalman
      }

      filtrar(medicion) {
        if (this.x === null) {
          this.x = medicion;
          return this.x;
        }

        // Manejo del cruce 0°/360°
        let diff = medicion - this.x;
        if (diff > 180) diff -= 360;
        if (diff < -180) diff += 360;
        const medicionAjustada = this.x + diff;

        // Predicción
        this.P = this.P + this.Q;

        // Actualización
        this.K = this.P / (this.P + this.R);
        this.x = this.x + this.K * (medicionAjustada - this.x);
        this.P = (1 - this.K) * this.P;

        // Normalizar entre 0 y 360
        this.x = (this.x + 360) % 360;
        return this.x;
      }
    }

    // ── PUNTOS NÁUTICOS ────────────────────────────────────────
    const PUNTOS = [
      { nombre: "Pta. Torrecilla",     lat: 18.4281, lon: -69.8767, color: "#ffdd00", tipo: "⚓" },
      { nombre: "Pta. Palenque",       lat: 18.2050, lon: -70.1450, color: "#ff6600", tipo: "⚓" },
      { nombre: "Puerto Sto. Domingo", lat: 18.4720, lon: -69.9020, color: "#00aaff", tipo: "🚢" },
      { nombre: "Puerto Plata",        lat: 19.7808, lon: -70.6871, color: "#00ff99", tipo: "⚓" },
    ];

    const kalman = new KalmanBrujula();
    let miLat = null, miLon = null;
    let rumboFiltrado = 0;
    let usandoAbsolute = false;
    const FOV_H = 60;

    // ── CÁMARA ─────────────────────────────────────────────────
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
      .then(stream => { document.getElementById('camara').srcObject = stream; })
      .catch(() => { document.getElementById('info').textContent = 'Error: cámara no disponible'; });

    // ── GPS ────────────────────────────────────────────────────
    navigator.geolocation.watchPosition(pos => {
      miLat = pos.coords.latitude;
      miLon = pos.coords.longitude;
      document.getElementById('info').textContent =
        `GPS: ${miLat.toFixed(4)}, ${miLon.toFixed(4)}`;
      actualizarMarcadores();
    }, () => {
      document.getElementById('info').textContent = 'GPS: sin señal';
    }, { enableHighAccuracy: true });

    // ── BRÚJULA CON KALMAN ────────────────────────────────────
    window.addEventListener('deviceorientationabsolute', e => {
      if (e.alpha !== null) {
        usandoAbsolute = true;
        procesarRumbo(e.alpha);
      }
    });

    window.addEventListener('deviceorientation', e => {
      if (usandoAbsolute) return;
      if (e.webkitCompassHeading !== undefined) {
        procesarRumbo(e.webkitCompassHeading);
      } else if (e.absolute && e.alpha !== null) {
        procesarRumbo(e.alpha);
      }
    });

    function procesarRumbo(medicion) {
      rumboFiltrado = kalman.filtrar(medicion);
      document.getElementById('brujula').textContent = `⊕ ${Math.round(rumboFiltrado)}°`;
      actualizarMarcadores();
    }

    // ── CÁLCULOS NÁUTICOS ──────────────────────────────────────
    function calcularRumbo(lat1, lon1, lat2, lon2) {
      const toRad = d => d * Math.PI / 180;
      const dLon = toRad(lon2 - lon1);
      const y = Math.sin(dLon) * Math.cos(toRad(lat2));
      const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
                Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    function calcularDistancia(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 +
                Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // ── MARCADORES AR ──────────────────────────────────────────
    function actualizarMarcadores() {
      if (miLat === null) return;
      const W = window.innerWidth;
      const H = window.innerHeight;

      document.querySelectorAll('.marcador').forEach(m => m.remove());

      PUNTOS.forEach(p => {
        const rumboPunto = calcularRumbo(miLat, miLon, p.lat, p.lon);
        const dist = calcularDistancia(miLat, miLon, p.lat, p.lon);

        let diff = rumboPunto - rumboFiltrado;
        if (diff > 180) diff -= 360;
        if (diff < -180) diff += 360;

        if (Math.abs(diff) < FOV_H / 2) {
          const x = W / 2 + (diff / (FOV_H / 2)) * (W / 2);
          const y = H / 2 - 60;

          const div = document.createElement('div');
          div.className = 'marcador';
          div.style.left = x + 'px';
          div.style.top = y + 'px';
          div.innerHTML = `
            <div class="marcador-punto" style="background:${p.color}"></div>
            <div class="marcador-label">${p.tipo} ${p.nombre}</div>
            <div class="marcador-dist">${dist < 1 ? (dist*1000).toFixed(0)+'m' : dist.toFixed(1)+'km'}</div>
          `;
          document.body.appendChild(div);
        }
      });
    }
  </script>
</body>
</html>
